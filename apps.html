function render(){
  var list = APPS.filter(function(a){
    if(curCat!=="全部" && a.category_cn!==curCat) return false;
    if(curQ){
      var t=(a.zh_name+" "+a.name+" "+(a.short_description||"")+" "+(a.zh_desc||"")).toLowerCase();
      if(t.indexOf(curQ)<0) return false;
    }
    return true;
  });
  var g=document.getElementById("grid");
  g.innerHTML = list.length ? list.map(function(a){
    return '<div class="appcard" onclick="openApp(\''+a.uid+'\')">'
      + (a.icon?'<img loading="lazy" src="'+esc(a.icon)+'" alt="">':'')
      + '<h3>'+esc(a.zh_name)+'</h3>'
      + '<div class="en">'+esc(a.name)+' v'+esc(a.version)+'</div>'
      + '<p>'+esc(a.short_description||"")+'</p>'
      + '<a class="dl" href="'+esc(a.download_url)+'" target="_blank" onclick="event.stopPropagation()">⬇ 直接下载 fap</a> '
      + '<span class="more">详情 →</span></div>';
  }).join("") : '<div style="color:#888;text-align:center;padding:30px">没有找到相关应用，换个关键词试试～</div>';
}
function openApp(uid){
  var a = APPS.find(function(x){return x.uid===uid;});
  if(!a) return;
  var shots=(a.screenshot?[a.screenshot]:[]).map(function(s){return '<img loading="lazy" src="'+esc(s)+'">';}).join("");
  document.getElementById("modalBox").innerHTML =
    '<button class="close" onclick="closeApp()">✕</button>'
    + '<h2 style="color:#ffd700">'+esc(a.zh_name)+'</h2>'
    + '<div style="color:#888;font-size:.85em">'+esc(a.name)+' v'+esc(a.version)+' · '+esc(a.category_cn)+' · 作者 '+esc(a.author)+'</div>'
    + (a.icon?'<img src="'+esc(a.icon)+'" style="width:96px">':'')
    + '<p style="margin:10px 0">'+esc(a.zh_desc||a.short_description||"")+'</p>'
    + shots
    + '<div style="margin-top:14px"><a class="btn btn-y" href="'+esc(a.download_url)+'" target="_blank">⬇ 直接下载 fap</a>'
    + (a.source_url?'<a class="btn btn-b" href="'+esc(a.source_url)+'" target="_blank">查看源码</a>':'')
    + (a.lab_url?'<a class="btn btn-b" href="'+esc(a.lab_url)+'" target="_blank">Flipper Lab</a>':'')
    + '</div>'
    + '<div style="color:#777;font-size:.78em;margin-top:8px">下载后把 .fap 放入设备 SD 卡 apps 目录（可建分类子目录），设备上打开 应用 菜单运行。</div>';
  document.getElementById("modalBg").style.display="block";
  document.getElementById("modalBox").style.display="block";
}
function closeApp(){document.getElementById("modalBg").style.display="none";document.getElementById("modalBox").style.display="none";}
document.getElementById("q").addEventListener("input",function(){curQ=this.value.trim().toLowerCase();render();});
document.getElementById("cats").addEventListener("click",function(e){
  if(e.target.classList.contains("chip")){
    document.querySelectorAll(".chip").forEach(function(c){c.classList.remove("on");});
    e.target.classList.add("on");curCat=e.target.getAttribute("data-c");render();
  }
});
render();
</script>
